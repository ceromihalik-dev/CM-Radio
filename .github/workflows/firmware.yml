name: Firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m platformio run -d firmware
      - run: python scripts/check_project.py
      - run: python scripts/package_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: CM-Radio-WROVER-V0.1.2-0a08
          path: dist/CM-Radio-V0.1.2-0a08/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CM-Radio-WROVER-V0.1.2-0a08
          path: firmware
      - run: zip -r CM-Radio-WROVER-V0.1.2-0a08.zip firmware
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CM-Radio-WROVER-V0.1.2-0a08.zip --repo "$GITHUB_REPOSITORY" --title "CM-Radio $GITHUB_REF_NAME" --notes "Build-geprüfter Firmwarestand für Loud-ESP32 WROVER-N8R8. Physische Hardwaretests stehen aus. Erststart siehe ERSTSTART.md im ZIP."
