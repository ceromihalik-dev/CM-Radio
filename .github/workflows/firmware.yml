name: Firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m platformio run -d firmware
      - run: python scripts/check_project.py
      - run: python scripts/package_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: CM-Radio-WROVER-V0.1.3-09
          path: dist/CM-Radio-V0.1.3-09/
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CM-Radio-WROVER-V0.1.3-09
          path: firmware
      - name: Prepare release metadata and archive
        shell: bash
        run: |
          python3 - <<'PYMETA'
          import json, os, pathlib, zipfile
          root = pathlib.Path('firmware')
          manifest = json.loads((root / 'manifest.json').read_text())
          version, build = manifest['version'], manifest['build']
          tag = f'v{version}-build{build}'
          archive = f'CM-Radio_Firmware_v{version}_Build_{build}.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as out:
              for item in sorted(root.iterdir()):
                  if item.is_file():
                      out.write(item, item.name)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_TAG={tag}\nRELEASE_ARCHIVE={archive}\n')
          pathlib.Path('release-notes.md').write_text(
              f'CM-Radio **v{version} · Build {build}** für Loud-ESP32 WROVER-N8R8.\n\n'
              'Firmware-Kompilierung und automatische Softwaretests bestanden. '
              'Die Abnahme dieses Builds am Gerät steht noch aus.\n\n'
              'Update: ZIP entpacken; unter **Gerät → Firmwareupdate** '
              '**manifest.json** und **firmware.bin** auswählen.\n\n'
              'Für die Erstinstallation per USB liegt **USB_ERSTINSTALLATION.txt** bei. '
              'Beim normalen Firmwareupdate bleiben gespeicherte Einstellungen erhalten.\n',
              encoding='utf-8')
          PYMETA
      - name: Publish versioned firmware release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving published files unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CM-Radio $RELEASE_TAG" --notes-file release-notes.md
